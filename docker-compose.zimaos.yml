# ZimaOS one-click import template.
# Before submitting, replace the administrator-token placeholder below.
name: android-server-manager

services:
  android-server-manager:
    container_name: android-server-manager
    platform: linux/amd64
    # Published automatically by .github/workflows/publish-container.yml.
    image: ghcr.io/josegustavo14/mobile-controller-linux-deploy:latest
    environment:
      HOME: /app/data
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DATABASE_URL: sqlite:///./data/app.db
      ADB_PATH: /opt/android-platform-tools/adb
      # 5038 avoids colliding with another ADB server on the ZimaOS host.
      ADB_SERVER_PORT: "5038"
      ADB_TIMEOUT: "20"
      ADB_MDNS_OPENSCREEN: "1"
      SCRCPY_PATH: /opt/scrcpy/scrcpy
      SCRCPY_VIEWER_PORT: "6080"
      TERMUX_AGENT_PORT: "8765"
      # Use the same long random value when starting termux/asm-agent.py on Android.
      TERMUX_AGENT_TOKEN: CHANGE_ME_WITH_ANOTHER_LONG_RANDOM_TOKEN
      UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/josegustavo14/mobile-controller-linux-deploy/main/version.json
      UPDATER_URL: http://127.0.0.1:8090
      # Use this same random value in the updater service below.
      UPDATER_TOKEN: CHANGE_ME_WITH_A_THIRD_LONG_RANDOM_TOKEN
      UPDATER_IMAGE: ghcr.io/josegustavo14/mobile-controller-linux-deploy:latest
      # Generate one with: openssl rand -hex 32
      ADMIN_TOKEN: CHANGE_ME_WITH_A_LONG_RANDOM_TOKEN
      LINUX_DEPLOY_CLI: /data/user/0/ru.meefik.linuxdeploy/files/bin/linuxdeploy
      LOG_LEVEL: INFO
      # The bundled web interface is same-origin; no ZimaOS IP is required here.
      ALLOWED_ORIGINS: http://localhost:8080
    # QR pairing relies on LAN multicast DNS, which Docker bridge mode does not forward reliably.
    # Host networking is Linux-only and appropriate for the ZimaOS deployment target.
    network_mode: host
    volumes:
      # Short syntax is required by the current ZimaOS Compose importer.
      - android-server-manager-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  android-server-manager-updater:
    container_name: android-server-manager-updater
    platform: linux/amd64
    image: nickfedor/watchtower:1.20.3
    command:
      - android-server-manager
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: CHANGE_ME_WITH_A_THIRD_LONG_RANDOM_TOKEN
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
    ports:
      # The update API is reachable only from the ZimaOS host/network namespace.
      - 127.0.0.1:8090:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  android-server-manager-data:
    name: android-server-manager-data

# ZimaOS/CasaOS dashboard metadata. The icon is served directly from this repository.
x-casaos:
  id: android-server-manager
  main: android-server-manager
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/josegustavo14/mobile-controller-linux-deploy/main/assets/android-server-manager-icon.png
  version: "1.3.1"
  title:
    en_US: Android Server Manager
    pt_BR: Gerenciador de Servidor Android
